[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Keep previews and explorations out of search engines until launch.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# 24 Nov page picks: four case studies only, and three service pages. Older routes point to their new homes.
# (302s: the content files stay in the repo and these can come back.)
